<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Iniciativas FPR · 15 años</title>
<meta name="description" content="Las iniciativas de Foundation for Puerto Rico presentadas en su 15 aniversario.">
<link rel="icon" href="assets/fpr-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#FF4D38; --red-700:#B82415; --yellow:#FFA600; --green:#A6BF33; --blue:#338CB3; --blue-700:#205D7B;
  --charcoal:#2A2E2E; --gray:#666666; --gray-soft:#E6E6E6; --off:#F2F2F2; --paper:#F7F7F7; --white:#FFFFFF;
  --font:"Gotham","Montserrat","Roboto",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--white);color:var(--charcoal);font:400 17px/1.55 var(--font);-webkit-text-size-adjust:100%}
a{color:var(--blue-700)}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--white);border-bottom:1px solid var(--gray-soft)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
header.top img{height:34px;width:auto;display:block}
.lang{display:flex;border:1px solid var(--charcoal);border-radius:4px;overflow:hidden}
.lang button{font:600 14px var(--font);padding:6px 12px;border:0;background:var(--white);color:var(--charcoal);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--charcoal);color:var(--white)}
.hero{padding:40px 0 28px;border-bottom:4px solid var(--red)}
.kicker{font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--red-700);margin:0 0 8px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.1;margin:0 0 12px;letter-spacing:-.01em}
.lede{font-size:19px;color:var(--charcoal);margin:0;max-width:640px}
h2.groups{font-size:22px;margin:36px 0 4px}
.index-group{margin:20px 0 0}
.index-group h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin:0 0 8px}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cards a{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--gray-soft);border-left:4px solid var(--blue);border-radius:4px;text-decoration:none;color:var(--charcoal);background:var(--white);min-height:56px}
.cards a:hover{background:var(--paper)}
.cards .name{font-weight:600;font-size:15px;line-height:1.3}
article.ini{padding:44px 0 36px;border-top:1px solid var(--gray-soft);scroll-margin-top:68px}
article.ini.solo{padding-top:28px;border-top:0}
.solo-kicker{margin:0;padding-top:28px}
#otras{border-top:4px solid var(--red);padding-top:4px;scroll-margin-top:68px}
.all{display:inline-block;margin-top:20px;font-weight:600;font-size:15px}
.group{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin:0 0 4px}
.ini h2{font-size:clamp(24px,4.6vw,32px);line-height:1.15;margin:0}
.tagline{font-size:19px;font-weight:600;color:var(--blue-700);margin:14px 0 12px}
.ini p{margin:0 0 12px}
figure{margin:18px 0}
figure img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:4px;display:block;background:var(--off)}
figcaption{font-size:14px;color:var(--gray);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--paper);border-left:4px solid var(--yellow);padding:12px 14px;border-radius:2px}
.stat .v{font-size:28px;font-weight:700;line-height:1.1}
.stat .l{font-size:15px;margin-top:4px}
.stat .s{font-size:13px;color:var(--gray);margin-top:6px}
.chart{margin:20px 0;padding:16px;border:1px solid var(--gray-soft);border-radius:4px}
.chart h3{font-size:16px;margin:0 0 12px}
.bar-row{display:grid;grid-template-columns:minmax(70px,30%) 1fr;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.bar-track{position:relative;height:26px}
.bar{height:100%;background:var(--blue);border-radius:0 4px 4px 0;min-width:2px}
.bar-val{position:absolute;top:50%;transform:translateY(-50%);font-weight:700;font-size:14px;padding-left:6px;white-space:nowrap}
.chart .src{font-size:13px;color:var(--gray);margin-top:10px}
figure.logo img{max-width:220px;aspect-ratio:600/340;object-fit:contain;background:none}
.steps{margin:20px 0;padding:16px;border:1px solid var(--gray-soft);border-radius:4px}
.steps h3{font-size:16px;margin:0 0 12px}
.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;background:var(--paper);border-radius:999px;font-size:15px;font-weight:600}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--blue-700);color:var(--white);font-size:13px}
.steps ol.unordered li::before{content:"";width:10px;height:10px;background:var(--green)}
.steps ol:not(.unordered) li:not(:last-child)::after{content:"→";color:var(--gray);margin-left:6px}
.challenge{border-left:4px solid var(--red);background:var(--white);padding:4px 0 4px 16px;margin:20px 0}
.challenge h3,.block h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin:0 0 6px}
.challenge p{margin:0}
.blocks{display:grid;grid-template-columns:1fr;gap:20px;margin:20px 0}
@media (min-width:720px){.blocks{grid-template-columns:1fr 1fr}.blocks .wide{grid-column:1/-1}}
.block p{margin:0 0 10px}
.note{font-size:14px;color:var(--gray);margin:8px 0 0}
.block ul{margin:0;padding-left:20px}
.block li{margin:0 0 8px}
.block.progress ul{list-style:none;padding-left:0}
.block.progress li{position:relative;padding-left:26px}
.block.progress li::before{content:"✓";position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:var(--green);color:var(--charcoal);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.chips li{border:1px solid var(--gray-soft);border-radius:999px;padding:4px 12px;font-size:14px;margin:0}
.meta{font-size:15px;margin:16px 0 0}
.meta dt{font-weight:700;display:inline}
.meta dd{display:inline;margin:0}
.meta div{margin:4px 0}
.cta{display:inline-block;margin:18px 16px 0 0;padding:10px 18px;border-radius:999px;background:var(--red-700);color:#fff;font-weight:700;text-decoration:none}
.cta:hover,.cta:focus-visible{background:var(--charcoal);color:#fff}
.back{display:inline-block;margin-top:18px;font-weight:600;font-size:15px}
footer{border-top:4px solid var(--red);margin-top:40px;padding:28px 0 48px;font-size:15px;color:var(--gray)}
footer img{height:30px;width:auto;margin-bottom:10px}
.noscript{padding:24px 0}
/* ===== Boards: initiative pages laid out like the printed dBoards ===== */
body{overflow-x:clip}
.t-red{--c:var(--red);--cd:var(--red-700);--cl:#FFF0EE}
.t-yellow{--c:var(--yellow);--cd:#8A5200;--cl:#FFF7E0}
.t-green{--c:var(--green);--cd:#47560F;--cl:#F4F8E3}
.t-blue{--c:var(--blue);--cd:var(--blue-700);--cl:#E5F3FA}
.t-navy{--c:var(--blue-700);--cd:var(--blue-700);--cl:#E5F3FA}
.t-charcoal{--c:var(--charcoal);--cd:var(--charcoal);--cl:var(--off)}
.board{position:relative;padding-top:8px}
.board .acc{color:var(--red-700)}
.b-deco{position:absolute;top:-8px;right:-16px;width:120px;height:120px;pointer-events:none;overflow:hidden}
.b-deco::before{content:"";position:absolute;top:-40px;right:-30px;width:110px;height:110px;border-radius:50%;background:var(--blue)}
.b-deco::after{content:"";position:absolute;top:18px;right:-34px;width:84px;height:84px;border-radius:50%;background:var(--yellow)}
.board.brand .b-deco{display:none}
.b-kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);margin:0 0 6px;padding-right:90px}
.board .b-title{font-size:clamp(30px,6.4vw,54px);font-weight:700;line-height:1.05;letter-spacing:-.015em;margin:0;padding-right:70px}
.board.brand .b-title{padding-right:0}
.board .b-title .acc{color:var(--red)}
.board.hub .b-title{border-bottom:4px solid var(--red);padding-bottom:12px}
.b-sub{font-size:clamp(18px,2.6vw,23px);font-weight:700;color:var(--red-700);line-height:1.3;margin:14px 0 0}
.b-intro{display:grid;gap:20px;margin:18px 0 8px;align-items:start}
.b-intro .b-lead{font-weight:700;font-size:18px}
.b-intro p{margin:0 0 12px}
@media (min-width:760px){.b-intro.has-photo{grid-template-columns:1fr 1fr}}
.b-photo{margin:0}
.b-photo img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--off)}
.b-photo.top{margin:0 -16px 20px}
.b-photo.top img{aspect-ratio:auto;max-height:420px;border-radius:0 0 80px 0}
@media (min-width:1072px){.b-photo.top{margin:0 0 24px}.b-photo.top img{border-radius:10px 80px 10px 10px}}
.b-photo figcaption{font-size:13px}
.b-sec{margin:44px 0 0}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--cd);color:#fff;margin:0 0 10px}
.b-h{font-size:clamp(24px,4.2vw,36px);font-weight:700;line-height:1.12;margin:0 0 16px;letter-spacing:-.01em}
.b-h::after{content:"";display:block;width:44px;height:4px;background:var(--yellow);margin-top:12px;border-radius:2px}
.b-h .acc{color:var(--red)}
.b-leadp{font-weight:700;margin:0 0 12px}
.b-sec>p,.b-side p{margin:0 0 12px}
.b-side{display:grid;gap:8px 32px}
@media (min-width:760px){.b-side{grid-template-columns:minmax(180px,26%) 1fr}.b-side .b-h{margin:0}}
.b-sec.band{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding:36px calc(50vw - 50%)}
.b-sec.band-blue{background:var(--blue);color:#fff}
.b-sec.band-blue .b-h,.b-sec.band-blue p{color:#fff;font-weight:700}
.b-sec.band-blue .b-h::after{background:var(--yellow)}
.b-sec.band-yellow{background:var(--yellow);color:var(--charcoal)}
.b-sec.band-yellow .b-h::after{background:var(--charcoal)}
.b-sec.band-yellow p{font-weight:600}
.b-sec.dark{background:var(--charcoal);color:#fff}
.b-sec.dark a{color:var(--yellow)}
.b-sec.dark .acc,.b-sec.dark .b-h .acc{color:var(--yellow)}
.b-sec.dark .t-red{--cd:#FF8270}.b-sec.dark .t-blue,.b-sec.dark .t-navy{--cd:#8FCAE8}.b-sec.dark .t-green{--cd:var(--green)}.b-sec.dark .t-yellow{--cd:var(--yellow)}
.b-sec.dark .card{background:#3A3F3F;border-color:#3A3F3F;color:#fff}
.b-sec.dark .b-cta{color:var(--charcoal)}
.b-blocks>*+*{margin-top:18px}
.b-sec .b-blocks{margin-top:16px}
.b-h4{font-size:19px;font-weight:700;margin:0 0 10px;line-height:1.3}
.kick{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cd,var(--gray));margin:0 0 8px}
.panel{background:var(--off);border-radius:12px;padding:18px}
.panel.outline{background:var(--white);border:2px solid var(--c)}
.panel.tinted{background:var(--cl)}
.panel>p{margin:0 0 10px}
.callout{border-left:5px solid var(--c,var(--red));background:var(--off);padding:14px 18px;border-radius:0 10px 10px 0}
.callout p{margin:0}
.callout .b-h4{margin-bottom:4px}
.callout.plain{background:none;font-style:italic}
.callout.dark{background:var(--charcoal);color:#fff;border-left:0;border-radius:10px}
.callout.dark .acc,.callout.dark strong{color:var(--yellow)}
.b-note{font-size:14px;color:var(--gray);font-style:italic;margin:0}
.b-row{display:grid;gap:16px}
@media (min-width:760px){.b-row{grid-template-columns:var(--cols,1fr 1fr)}}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.grid.c2,.grid.c3,.grid.c4,.grid.c5,.grid.c6{grid-template-columns:1fr 1fr}}
@media (min-width:860px){.grid.c3,.grid.c6{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}.grid.c5{grid-template-columns:repeat(5,1fr)}}
.ico{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--cl,var(--off));color:var(--cd,var(--charcoal))}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.txt{font-weight:700;font-size:17px}
.ico.solid{background:var(--c,var(--blue));color:#fff;width:56px;height:56px}.ico.solid svg{width:26px;height:26px}
.t-yellow .ico.solid,.t-green .ico.solid{color:var(--charcoal)}
/* compare: today vs. with the initiative */
.compare{display:grid;gap:12px}
@media (min-width:760px){.compare{grid-template-columns:1fr 1fr}}
.compare .panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
@media (min-width:560px){.compare .panel ul.flow{flex-direction:row;align-items:center}.compare .panel ul.flow li{flex:1}}
.compare li{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;line-height:1.3}
.compare .before .ico{background:var(--white);color:var(--charcoal)}
.compare .after{background:var(--cl);border:2px solid var(--c)}
.compare .after .ico{background:var(--white)}
/* cards */
.card{background:var(--white);border:1px solid var(--gray-soft);border-top:5px solid var(--c,var(--gray-soft));border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.card.flat{border-top-width:1px}
.card.soft{background:var(--off);border-color:var(--off)}
.card.left{border-top-width:1px;border-left:5px solid var(--c)}
.card h4{font-size:19px;font-weight:700;margin:0;line-height:1.25}
.card .sub{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin:0}
.card p{margin:0;font-size:15px}
.card p+p{margin-top:6px}
.card ul{margin:4px 0 0;padding-left:18px;font-size:15px}
.card .tag{margin-top:auto;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--cl);color:var(--cd)}
.card .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:1px}
.card.dotted h4{color:var(--cd)}
.card dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:8px 0 0;border-top:1px solid var(--gray-soft);padding-top:10px}
.card dt{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.card dd{margin:2px 0 0;font-weight:600;font-size:15px;line-height:1.35}
.card .ico{margin-bottom:4px}
.card .val{font-size:30px;font-weight:700;color:var(--cd);line-height:1.1}
/* icon lists */
.ilist{list-style:none;margin:0;padding:0;display:grid;gap:16px 28px}
@media (min-width:760px){.ilist.c2{grid-template-columns:1fr 1fr}.ilist .wide{grid-column:1/-1}}
.ilist li{display:flex;gap:14px;align-items:flex-start}
.ilist.ruled li{border-bottom:1px solid var(--gray-soft);padding-bottom:16px}.ilist.ruled li:last-child{border:0;padding-bottom:0}
.ilist p{margin:0;font-size:16px}
.ilist .tt{font-weight:700;display:block}
.igrid{list-style:none;margin:0;padding:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.igrid li{display:flex;flex-direction:column;gap:6px;font-size:15px}
.igrid.center li{align-items:center;text-align:center;font-weight:600}
.igrid .tt{font-weight:700}
.igrid p{margin:0}
/* numbered steps */
.nsteps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:n}
.nsteps li{counter-increment:n;display:flex;gap:14px;align-items:flex-start}
.nsteps li::before{content:counter(n);flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--blue-700);color:#fff;font-weight:700}
.nsteps p{margin:4px 0 0}
.nrow{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));counter-reset:n}
.nrow li{counter-increment:n;background:var(--white);border:1px solid var(--gray-soft);border-top:5px solid var(--c);border-radius:10px;padding:12px 14px;font-size:15px}
.nrow li::before{content:counter(n,decimal-leading-zero);display:block;font-size:30px;font-weight:700;color:var(--blue-700);line-height:1.1;margin-bottom:6px}
.nrow.boxes li{background:var(--off);border:0;display:flex;gap:10px;align-items:flex-start}
.nrow.boxes li::before{content:counter(n);font-size:14px;flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--blue-700);color:#fff;margin:0}
/* stats */
.st{display:flex;flex-direction:column;gap:4px;background:var(--white);border:1px solid var(--gray-soft);border-radius:10px;padding:14px 16px}
.st.bar{border:0;border-top:5px solid var(--c);border-radius:0;padding:14px 0 0;background:none}
.st.soft{background:var(--off);border-color:var(--off)}
.st.topline{border-top:5px solid var(--c)}
.st .v{font-size:clamp(28px,4.4vw,40px);font-weight:700;line-height:1.05;color:var(--cd,var(--blue-700));letter-spacing:-.01em}
.st .l{font-weight:700;font-size:15px}
.st p{margin:0;font-size:15px}
.st .s{font-size:12px;color:var(--gray)}
.hl{display:grid;gap:16px;background:var(--off);border-radius:12px;padding:22px}
@media (min-width:760px){.hl{grid-template-columns:minmax(220px,42%) 1fr;align-items:center}}
.hl .v{font-size:clamp(38px,6.4vw,58px);font-weight:700;color:var(--blue-700);line-height:1;letter-spacing:-.02em}
.hl .vs{font-size:20px;font-weight:700;color:var(--blue-700);margin-top:6px}
.hl p{margin:0 0 8px}
.hl ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hl li{display:flex;gap:10px;align-items:center}
.hl li::before{content:"✓";flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#E5F3FA;color:var(--blue-700);font-size:13px;font-weight:700}
/* bars, split bars and waffles */
.bars{display:grid;gap:14px}
.bars .bv{font-size:34px;font-weight:700;color:var(--cd);line-height:1}
.bars .bl{font-size:14px;font-weight:600;margin:2px 0 6px}
.track{height:12px;background:var(--gray-soft);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:999px}
.split{display:flex;height:16px;border-radius:999px;overflow:hidden;margin:8px 0 4px}
.split i{display:block;height:100%;background:var(--c)}
.split-l{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.waffle{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:150px;margin-bottom:8px}
.waffle i{aspect-ratio:1;border-radius:2px;background:var(--gray-soft)}
.waffle i.on{background:var(--c)}
.waffle.ten{grid-template-columns:repeat(10,12px);gap:5px;max-width:none}.waffle.ten i{border-radius:50%}
/* closing, call to action, sources */
.b-closing{margin:44px 0 0;border-top:4px solid var(--red);background:var(--off);padding:22px 20px;font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.3;border-radius:0 0 10px 10px}
.b-cta{margin:36px 0 0;border-radius:18px;padding:24px;background:var(--c,var(--yellow));color:var(--charcoal)}
.b-cta.t-red{background:linear-gradient(90deg,var(--red-700),#E03220);color:#fff}
.b-cta .kick{color:inherit}
.b-cta h3{font-size:clamp(22px,3.6vw,32px);margin:0 0 6px;line-height:1.15}
.b-cta p{margin:0 0 14px}
.b-cta a{display:inline-block;padding:10px 18px;border-radius:999px;background:var(--charcoal);color:#fff;font-weight:700;text-decoration:none}

<body>
<header class="top"><div class="wrap">
  <a href="#inicio" aria-label="Foundation for Puerto Rico"><img src="assets/fpr-logo.svg" alt="Foundation for Puerto Rico"></a>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es" aria-pressed="true">ES</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</div></header>
<main class="wrap" id="app">
  <noscript><p class="noscript">Esta página necesita JavaScript. / This page requires JavaScript. <a href="https://foundationforpuertorico.org">foundationforpuertorico.org</a></p></noscript>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<script>
(() => {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const params = new URLSearchParams(location.search);
  let lang = params.get("lang") === "en" ? "en" : "es";
  try { const saved = localStorage.getItem("fpr15-lang"); if (!params.get("lang") && saved) lang = saved; } catch (e) {}
  let data;
  const t = (o, k) => o?.[`${k}_${lang}`] ?? o?.[`${k}_es`] ?? "";
  // Escaped text; a leading "**Label:**" becomes a bold lead-in.
  const rich = s => esc(s).replace(/^\*\*(.+?)\*\*/, "<strong>$1</strong>");

  function chart(c) {
    if (!c || !c.data?.length) return "";
    const max = Math.max(...c.data.map(d => d.value));
    const fmt = v => (c.prefix || "") + v.toLocaleString(lang === "en" ? "en-US" : "es-PR") + (c.suffix || "");
    const lbl = d => t(d, "label") || d.label;
    const summary = c.data.map(d => `${lbl(d)}: ${fmt(d.value)}`).join("; ");
    return `<div class="chart" role="img" aria-label="${esc(t(c, "title"))}. ${esc(summary)}">
      <h3>${esc(t(c, "title"))}</h3>
      ${c.data.map(d => `<div class="bar-row" aria-hidden="true"><span>${esc(lbl(d))}</span>
        <div class="bar-track"><div class="bar" style="width:${(d.value / max * 78).toFixed(1)}%"></div>
        <span class="bar-val" style="left:${(d.value / max * 78).toFixed(1)}%">${esc(fmt(d.value))}</span></div></div>`).join("")}
      ${c.source ? `<div class="src">${data.ui[lang].source}: ${esc(c.source)}</div>` : ""}
    </div>`;
  }

  // The initiative named in the URL hash (#vepm), or null for the full page.
  const focusId = () => {
    const id = decodeURIComponent(location.hash.slice(1));
    return data.initiatives.some(i => i.id === id) ? id : null;
  };

  // Index cards grouped by area, leaving out the initiative with id `skip`.
  function cards(skip) {
    const groups = [...new Set(data.initiatives.map(i => t(i, "group")))];
    return groups.map(g => {
      const items = data.initiatives.filter(i => t(i, "group") === g && i.id !== skip);
      return items.length ? `<div class="index-group"><h3>${esc(g)}</h3><ul class="cards">
        ${items.map(i => `<li><a href="#${i.id}"><span class="name">${esc(t(i, "name"))}</span></a></li>`).join("")}
      </ul></div>` : "";
    }).join("");
  }

  function render() {
    const ui = data.ui[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    const app = document.getElementById("app");
    const id = focusId();
    if (id) {
      // Opened from a QR code or a card: this initiative alone, then the rest to keep browsing.
      const i = data.initiatives.find(i => i.id === id);
      document.title = `${t(i, "name")} · ${ui.title}`;
      // The id sits on a wrapper that starts with the kicker, so the browser's own jump
      // to #id lands at the top of the view instead of hiding the kicker under the header.
      app.innerHTML = `
        <div id="${i.id}" style="scroll-margin-top:68px">
          <p class="kicker solo-kicker">${esc(ui.kicker)}</p>
          ${article(i, true)}
        </div>
        <section id="otras" aria-labelledby="otras-h">
          <h2 class="groups" id="otras-h">${esc(ui.others)}</h2>
          ${cards(id)}
          <a class="all" href="#inicio">${esc(ui.all)} →</a>
        </section>`;
    } else {
      document.title = ui.title;
      app.innerHTML = `
      <section class="hero" id="inicio">
        <p class="kicker">${esc(ui.kicker)}</p>
        <h1>${esc(ui.title)}</h1>
        <p class="lede">${esc(ui.lede)}</p>
      </section>
      <section id="iniciativas" aria-labelledby="idx-h" style="scroll-margin-top:68px">
        <h2 class="groups" id="idx-h">${esc(ui.index)}</h2>
        ${cards(null)}
      </section>
      ${data.initiatives.map(i => article(i, false)).join("")}`;
    }
    document.getElementById("foot").innerHTML = `<img src="assets/fpr-logo.svg" alt="Foundation for Puerto Rico"><p>${esc(ui.footer)} · <a href="https://foundationforpuertorico.org/${lang}/">foundationforpuertorico.org</a></p>`;
  }

  // ===== Board renderer: initiative pages laid out like the printed dBoards =====
  // An initiative with a "board" object uses this layout; the rest keep the plain one.
  // Inline marks in board text: **bold**, *italic*, ==accent==.
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/==(.+?)==/g, '<span class="acc">$1</span>').replace(/(^|[^*\w])\*([^*]+?)\*/g, "$1<em>$2</em>");
  const tx = (o, k) => md(t(o, k));
  const arr = (o, k) => o?.[`${k}_${lang}`] || o?.[`${k}_es`] || [];
  const tone = o => o?.tone ? ` t-${o.tone}` : "";
  const ICONS = {
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',
    clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',

    bed:'<path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/>',

    book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8"/>',
    map:'<path d="M14.1 6.3 9.9 4.2a2 2 0 0 0-1.8 0L3.6 6.5A1 1 0 0 0 3 7.4v12.1a1 1 0 0 0 1.4.9l3.7-1.8a2 2 0 0 1 1.8 0l4.2 2.1a2 2 0 0 0 1.8 0l4.5-2.3a1 1 0 0 0 .6-.9V5.4a1 1 0 0 0-1.4-.9l-3.7 1.8a2 2 0 0 1-1.8 0ZM15 6v15M9 3v15"/>',

    users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    trend:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',

    link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.940 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>',

    shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',

    heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
    home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

    anchor:'<circle cx="12" cy="5" r="3"/><path d="M12 22V8M5 12H2a10 10 0 0 0 20 0h-3"/>',
    plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
    tree:'<path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7z"/><path d="M12 22v-3"/>',
    bus:'<path d="M8 6v6M15 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>',
    car:'<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
    boat:'<path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6M12 10v4M12 2v3"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    checksq:'<path d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.5"/><path d="m9 11 3 3L22 4"/>',
    flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>',
    globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/>',
    video:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/>',
    sparkle:'<path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/>',
    mountain:'<path d="m8 3 4 8 5-5 5 15H2L8 3z"/>',
    scale:'<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1ZM2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10M12 3v18M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
    lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    star:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>',
    bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/>',
    store:'<path d="M3 9 4.5 4h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/>',

    building:'<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18ZM6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"/>',
    lighthouse:'<path d="M9 22l1-14h4l1 14M8 8h8M10 8l.5-4h3L14 8M12 2v2M5 6l2 1M19 6l-2 1M7 22h10"/>',
    image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/>',
    talk:'<path d="M2 3h20M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3M7 21l5-5 5 5"/>',
    target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    dots:'<circle cx="6" cy="6" r="1.5"/><circle cx="12" cy="6" r="1.5"/><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/><circle cx="6" cy="18" r="1.5"/>',
    diamond:'<path d="M12 2 22 12 12 22 2 12z"/>',

    arrows:'<path d="M4 7h14l-3-3M4 12h16l-3-3M4 17h14l-3-3"/>'
  };
  // An icon name from ICONS, or "txt:1ª" for a short text badge.
  const icon = (n, cls = "") => !n ? "" : n.startsWith("txt:") ? `<span class="ico txt ${cls}" aria-hidden="true">${esc(n.slice(4))}</span>`
    : `<span class="ico ${cls}" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS[n] || ICONS.dots}</svg></span>`;
  const paras = (o, k = "text") => arr(o, k).map(p => `<p>${md(p)}</p>`).join("");
  const head = (o, h = "h4") => (t(o, "kicker") ? `<p class="kick">${tx(o, "kicker")}</p>` : "") + (t(o, "title") ? `<${h} class="b-h4">${tx(o, "title")}</${h}>` : "");
  const cls = (...xs) => xs.filter(Boolean).join(" ");

  const BLOCKS = {
    text: b => head(b) + (t(b, "lead") ? `<p class="b-leadp">${tx(b, "lead")}</p>` : "") + paras(b),
    note: b => `<p class="b-note">${tx(b, "text")}</p>`,
    callout: b => `<div class="${cls("callout", tone(b).trim(), b.style)}">${head(b)}<p>${tx(b, "text")}</p></div>`,

    photo: b => `<figure class="b-photo"><img src="${esc(b.src)}" alt="${esc(t(b, "alt"))}" loading="lazy" decoding="async">${t(b, "caption") ? `<figcaption>${esc(t(b, "caption"))}</figcaption>` : ""}</figure>`,
    chart: b => chart(b),
    compare: b => {
      const side = (s, c) => `<div class="${cls("panel", c, tone(s).trim())}"><p class="kick">${tx(s, "label")}</p><ul class="${b.flow === false ? "" : "flow"}">${(s.items || []).map(x => `<li>${icon(x.icon)}<span>${tx(x, "text")}</span></li>`).join("")}</ul></div>`;
      return head(b) + `<div class="compare">${side(b.before || {}, "before")}${side({ tone: "green", ...b.after }, "after")}</div>`;
    },
    cards: b => head(b) + `<div class="grid c${b.cols || 3}">${(b.items || []).map(c => `<div class="${cls("card", tone(c).trim(), b.style, c.dot && "dotted")}">

        ${t(c, "tag") ? `<span class="tag">${tx(c, "tag")}</span>` : ""}</div>`).join("")}</div>`,
    icons: b => head(b) + (b.style === "grid" || b.style === "center"
      ? `<ul class="${cls("igrid", b.style === "center" && "center")}">${(b.items || []).map(x => `<li class="${tone(x).trim()}">${icon(x.icon, b.solid ? "solid" : "")}${t(x, "title") ? `<span class="tt">${tx(x, "title")}</span>` : ""}${t(x, "text") ? `<p>${tx(x, "text")}</p>` : ""}</li>`).join("")}</ul>`
      : `<ul class="${cls("ilist", b.cols === 2 && "c2", b.ruled && "ruled")}">${(b.items || []).map(x => `<li class="${cls(tone(x).trim(), x.wide && "wide")}">${icon(x.icon, b.solid ? "solid" : "")}<p>${t(x, "title") ? `<span class="tt">${tx(x, "title")}</span>` : ""}${tx(x, "text")}</p></li>`).join("")}</ul>`),
    steps: b => head(b) + (b.style === "row" || b.style === "boxes"
      ? `<ol class="${cls("nrow", b.style === "boxes" && "boxes")}">${(b.items || []).map((x, n) => `<li class="t-${x.tone || ["blue", "yellow", "green", "red", "navy"][n % 5]}"><span>${t(x, "title") ? `<strong>${tx(x, "title")}</strong> ` : ""}${tx(x, "text")}</span></li>`).join("")}</ol>`
      : `<ol class="nsteps">${(b.items || []).map(x => `<li><p>${t(x, "title") ? `<strong>${tx(x, "title")}</strong> ` : ""}${tx(x, "text")}</p></li>`).join("")}</ol>`),
    stats: b => head(b) + `<div class="grid c${b.cols || (b.items || []).length}">${(b.items || []).map(x => `<div class="${cls("st", tone(x).trim(), b.style)}">
        ${t(x, "kicker") ? `<p class="kick">${tx(x, "kicker")}</p>` : ""}<div class="v">${tx(x, "value")}</div>
        ${t(x, "label") ? `<div class="l">${tx(x, "label")}</div>` : ""}${t(x, "text") ? `<p>${tx(x, "text")}</p>` : ""}${t(x, "source") ? `<div class="s">${tx(x, "source")}</div>` : ""}</div>`).join("")}</div>`,
    highlight: b => `<div class="${cls("hl", tone(b).trim())}"><div>${t(b, "kicker") ? `<p class="kick">${tx(b, "kicker")}</p>` : ""}<div class="v">${tx(b, "value")}</div>${t(b, "sub") ? `<div class="vs">${tx(b, "sub")}</div>` : ""}${t(b, "small") ? `<p class="b-note" style="margin-top:8px;font-style:normal">${tx(b, "small")}</p>` : ""}</div>
        <div>${t(b, "list_title") ? `<p class="kick t-navy">${tx(b, "list_title")}</p>` : ""}${paras(b)}${arr(b, "items").length ? `<ul>${arr(b, "items").map(x => `<li>${md(x)}</li>`).join("")}</ul>` : ""}</div></div>`,
    bars: b => head(b) + `<div class="bars">${(b.items || []).map(x => `<div class="${tone(x).trim()}"><div class="bv">${tx(x, "value")}</div><div class="bl">${tx(x, "label")}</div><div class="track" aria-hidden="true"><i style="width:${+x.pct}%"></i></div></div>`).join("")}</div>`,
    split: b => `<div class="${tone(b).trim()}">${head(b)}<div class="split" aria-hidden="true">${(b.parts || []).map(p => `<i class="t-${p.tone}" style="width:${+p.pct}%"></i>`).join("")}</div><div class="split-l">${(b.parts || []).map(p => `<span>${tx(p, "label")}</span>`).join("")}</div></div>`,
    waffle: b => `<div class="${tone(b).trim()}"><div class="${cls("waffle", b.of === 10 && "ten")}" aria-hidden="true">${Array.from({ length: b.of || 100 }, (_, n) => `<i${n < b.on ? ' class="on"' : ""}></i>`).join("")}</div><div class="st" style="border:0;padding:0;background:none"><div class="v">${tx(b, "value")}</div>${t(b, "text") ? `<p>${tx(b, "text")}</p>` : ""}</div></div>`
  };
  const blocks = xs => (xs || []).map(b => BLOCKS[b.type] ? `<div class="blk blk-${b.type}">${BLOCKS[b.type](b)}</div>` : "").join("");

  function section(s) {
    const theme = s.theme ? (s.theme === "dark" ? " band dark" : ` band band-${s.theme}`) : "";
    const pill = t(s, "label") ? `<span class="pill t-${s.tone || "navy"}">${tx(s, "label")}</span><br>` : "";
    const title = t(s, "title") ? `<h3 class="b-h">${tx(s, "title")}</h3>` : "";
    const body = (t(s, "lead") ? `<p class="b-leadp">${tx(s, "lead")}</p>` : "") + paras(s) + (s.blocks?.length ? `<div class="b-blocks">${blocks(s.blocks)}</div>` : "");
    return `<section class="b-sec${theme}">${s.layout === "side" ? `${pill}<div class="b-side"><div>${title}</div><div>${body}</div></div>` : pill + title + body}</section>`;
  }

  function board(i, solo) {
    const ui = data.ui[lang], b = i.board;
    const img = b.photo === false ? null : (b.photo || i.image);
    const fig = c => img ? `<figure class="b-photo ${c}"><img src="${esc(img.src)}" alt="${esc(t(img, "alt"))}" decoding="async"${solo ? "" : ' loading="lazy"'}>${t(img, "caption") ? `<figcaption>${esc(t(img, "caption"))}</figcaption>` : ""}</figure>` : "";
    const top = img && b.photo_top;
    const intro = (t(b, "lead") ? `<p class="b-lead">${tx(b, "lead")}</p>` : "") + paras(b, "intro");
    const linkUrl = i.link ? (i.link.url || t(i.link, "url")) : "";
    const formUrl = data.form && i.form_choice ? data.form.url + "&" + data.form.question + "=" + encodeURIComponent('"' + i.form_choice + '"') : "";
    const ctaHref = b.cta ? (b.cta.action === "form" ? formUrl : linkUrl) : "";
    const cta = ctaHref ? `<aside class="b-cta${tone(b.cta)}">${t(b.cta, "kicker") ? `<p class="kick">${tx(b.cta, "kicker")}</p>` : ""}<h3>${tx(b.cta, "title")}</h3>${t(b.cta, "text") ? `<p>${tx(b.cta, "text")}</p>` : ""}<a href="${esc(ctaHref)}"${ctaHref.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}${b.cta.action === "form" ? ' data-form' : ""}>${esc(t(b.cta, "button") || ui.more)} →</a></aside>` : "";
    return `
      <article class="ini board ${b.style || "hub"}${solo ? " solo" : ""}"${solo ? "" : ` id="${i.id}"`} data-id="${i.id}" aria-labelledby="h-${i.id}">
        ${b.style === "brand" ? "" : '<div class="b-deco" aria-hidden="true"></div>'}
        ${top ? fig("top") : ""}
        <header class="b-head">
          ${t(b, "kicker") ? `<p class="b-kicker">${tx(b, "kicker")}</p>` : ""}
          <h2 class="b-title" id="h-${i.id}">${tx(b, "title") || esc(t(i, "name"))}</h2>
          ${t(b, "subtitle") ? `<p class="b-sub">${tx(b, "subtitle")}</p>` : ""}
        </header>
        ${intro || (img && !top) ? `<div class="${cls("b-intro", img && !top && "has-photo")}"><div>${intro}</div>${top ? "" : fig("")}</div>` : ""}
        ${b.intro_blocks ? `<div class="b-blocks">${blocks(b.intro_blocks)}</div>` : ""}
        ${(b.sections || []).map(section).join("")}
        ${cta}
        ${t(b, "closing") ? `<p class="b-closing">${tx(b, "closing")}</p>` : ""}
        ${t(b, "sources") ? `<p class="b-src"><strong>${esc(ui.sources || ui.source)}:</strong> ${tx(b, "sources")}</p>` : ""}
        <dl class="meta">
          ${i.presenters ? `<div><dt>${ui.presenters}:</dt> <dd>${esc(i.presenters)}</dd></div>` : ""}
          ${i.link ? `<div><dt>${ui.more}:</dt> <dd><a href="${esc(linkUrl)}" rel="noopener">${esc(t(i.link, "label"))}</a></dd></div>` : ""}
        </dl>
        ${formUrl && b.cta?.action !== "form" ? `<a class="cta" href="${esc(formUrl)}" target="_blank" rel="noopener">${esc(ui.contact)} →</a>` : ""}
        ${solo ? `<a class="back" href="#otras" data-scroll>↓ ${esc(ui.back)}</a>` : `<a class="back" href="#iniciativas">↑ ${esc(ui.back)}</a>`}
      </article>`;
  }

  function article(i, solo) {
    if (i.board) return board(i, solo);
    const ui = data.ui[lang];
    return `
      <article class="ini${solo ? " solo" : ""}"${solo ? "" : ` id="${i.id}"`} data-id="${i.id}" aria-labelledby="h-${i.id}">
        <p class="group">${esc(t(i, "group"))}</p><h2 id="h-${i.id}">${esc(t(i, "name"))}</h2>
        ${t(i, "tagline") ? `<p class="tagline">${esc(t(i, "tagline"))}</p>` : ""}
        ${(i[`body_${lang}`] || i.body_es || []).map(p => `<p>${rich(p)}</p>`).join("")}
        ${i.image ? `<figure${i.image.logo ? ' class="logo"' : ""}><img src="${esc(i.image.src)}" alt="${esc(t(i.image, "alt"))}" loading="lazy" decoding="async">
          ${t(i.image, "caption") ? `<figcaption>${esc(t(i.image, "caption"))}</figcaption>` : ""}</figure>` : ""}
        ${t(i, "challenge") ? `<div class="challenge"><h3>${esc(ui.challenge)}</h3><p>${esc(t(i, "challenge"))}</p></div>` : ""}
        ${i.steps ? `<div class="steps"><h3>${esc(t(i.steps, "title"))}</h3><ol class="${i.steps.unordered ? "unordered" : ""}"${i.steps.unordered ? ' role="list"' : ""}>
          ${(i.steps[`items_${lang}`] || i.steps.items_es).map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>` : ""}
        ${(() => {
          const ul = xs => xs?.length ? `<ul>${xs.map(x => `<li>${rich(x)}</li>`).join("")}</ul>` : "";
          const list = (k, cls) => { const xs = i[`${k}_${lang}`] || i[`${k}_es`] || []; return xs.length ? `<div class="block ${cls}"><h3>${esc(ui[k])}</h3>${ul(xs)}</div>` : ""; };
          // Extra blocks carry their own title, taken from each team's document.
          const extra = (i.extra || []).map(b => `<div class="block${b.wide ? " wide" : ""}"><h3>${esc(t(b, "title"))}</h3>
            ${t(b, "text") ? `<p>${rich(t(b, "text"))}</p>` : ""}${ul(b[`items_${lang}`] || b.items_es)}
            ${t(b, "note") ? `<p class="note">${esc(t(b, "note"))}</p>` : ""}</div>`).join("");
          const html = list("approach", "approach") + extra + list("progress", "progress") + list("next", "next wide")
            + (i.partners?.length ? `<div class="block wide"><h3>${esc(ui.partners)}</h3><ul class="chips">${i.partners.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : "");
          return html ? `<div class="blocks">${html}</div>` : "";
        })()}
        ${i.stats?.length ? `<div class="stats">${i.stats.map(s => `<div class="stat"><div class="v">${esc(s.value)}</div>
          <div class="l">${esc(t(s, "label"))}</div>${s.source ? `<div class="s">${ui.source}: ${esc(s.source)}</div>` : ""}</div>`).join("")}</div>` : ""}
        ${t(i, "note") ? `<p class="note">${esc(t(i, "note"))}</p>` : ""}
        ${chart(i.chart)}
        <dl class="meta">
          ${i.presenters ? `<div><dt>${ui.presenters}:</dt> <dd>${esc(i.presenters)}</dd></div>` : ""}
          ${i.link ? `<div><dt>${ui.more}:</dt> <dd><a href="${esc(i.link.url || t(i.link, "url"))}" rel="noopener">${esc(t(i.link, "label"))}</a></dd></div>` : ""}
        </dl>
        ${data.form && i.form_choice ? `<a class="cta" href="${esc(data.form.url + "&" + data.form.question + "=" + encodeURIComponent('"' + i.form_choice + '"'))}" target="_blank" rel="noopener">${esc(ui.contact)} →</a>` : ""}
        ${solo ? `<a class="back" href="#otras" data-scroll>↓ ${esc(ui.back)}</a>` : `<a class="back" href="#iniciativas">↑ ${esc(ui.back)}</a>`}
      </article>`;
  }

  // Single view opens at the top; the full page scrolls to #iniciativas or an older anchor.
  function goToHash() {
    if (focusId() || !location.hash) return scrollTo(0, 0);
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) requestAnimationFrame(() => el.scrollIntoView({ block: "start" }));
  }

  // Cards and "#inicio" links change the hash: switch view without reloading.
  addEventListener("hashchange", () => { if (data) { render(); goToHash(); } });

  // "View other initiatives" in the single view scrolls down without touching the hash,
  // so a reload or shared link still opens the same initiative.
  document.addEventListener("click", e => {
    const a = e.target.closest("a[data-scroll]");
    if (!a) return;
    e.preventDefault();
    document.querySelector(a.getAttribute("href"))?.scrollIntoView({ block: "start" });
  });

  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("fpr15-lang", lang); } catch (e) {}
    const y = scrollY; render(); scrollTo(0, y);
  }));

  // Count clicks on the form button as GoatCounter events, one per initiative.
  document.addEventListener("click", e => {
    const a = e.target.closest("a.cta, a[data-form]");
    if (a) window.goatcounter?.count?.({ path: "form-" + a.closest("article").dataset.id, title: "Formulario", event: true });
  });
  fetch("content.json", { cache: "no-cache" }).then(r => r.json()).then(j => { data = j; render(); goToHash(); document.fonts?.ready.then(goToHash); })
    .catch(() => { document.getElementById("app").innerHTML = '<p class="noscript">No se pudo cargar el contenido. / Content could not be loaded. <a href="https://foundationforpuertorico.org">foundationforpuertorico.org</a></p>'; });
})();
</script>
<!-- GoatCounter: cookie-free visit count. The path keeps the #id, so each QR scan counts under its initiative. -->
<script>window.goatcounter = { path: () => location.pathname + location.hash };</script>
<script data-goatcounter="https://fpr15.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
